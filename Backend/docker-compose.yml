version: '3.8'
services:
  neo4j:
    image: neo4j:5.23.0
    container_name: neo4j_sprint0
    ports:
      - "7474:7474"  # HTTP Browser
      - "7687:7687"  # Bolt API
    environment:
      - NEO4J_AUTH=none  # Disable auth for local development
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: postgres_sprint0
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=medallion_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch_sprint0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Disable security for local development
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  beanstalkd:
    image: schickling/beanstalkd:latest
    container_name: beanstalkd_sprint0
    ports:
      - "11300:11300"
    restart: unless-stopped

volumes:
  neo4j_data:
  es_data:
  pg_data:
