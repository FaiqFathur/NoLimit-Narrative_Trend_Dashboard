<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Narative Scraper</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 320px;
      padding: 15px;
      background: #f8f9fa;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #0056b3;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 5px;
    }
    textarea {
      width: 100%;
      height: 120px;
      box-sizing: border-box;
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 10px;
    }
    button:hover {
      background: #218838;
    }
    .btn-group {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }
    .btn-group button {
      background: #007bff;
      margin-bottom: 0;
    }
    .btn-group button:hover {
      background: #0056b3;
    }
    button#stopBtn {
      background: #dc3545;
    }
    button#stopBtn:hover {
      background: #c82333;
    }
    button#resumeBtn {
      background: #ffc107;
      color: #000;
    }
    button#resumeBtn:hover {
      background: #e0a800;
    }
    .status {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      padding: 8px;
      background: #e9ecef;
      border-radius: 4px;
    }
    .input-group {
      margin-bottom: 10px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      margin-bottom: 3px;
    }
    .input-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h2>Narative Scraper</h2>
  
  <div class="status" id="statusBox">
    Status: <strong id="statusText">Idle</strong><br>
    Progress: <strong id="progressText">0 / 0</strong><br>
    Sisa Antrean: <span id="queueCount">0</span> URL
  </div>

  <div class="input-group">
    <label for="scrollDuration">Lama Scroll Per URL (detik):</label>
    <input type="number" id="scrollDuration" value="60" min="10">
  </div>

  <div class="input-group">
    <label for="urlList">Daftar URL (1 per baris):</label>
    <textarea id="urlList" placeholder="https://www.instagram.com/explore/tags/jakarta/&#10;https://www.instagram.com/explore/tags/bandung/"></textarea>
  </div>

  <div class="btn-group">
    <button id="loadIgBtn">Load IG Links</button>
    <button id="loadTiktokBtn">Load TikTok Links</button>
  </div>

  <div class="btn-group">
    <button id="startBtn">▶ Mulai Baru</button>
    <button id="resumeBtn">⏸ Resume</button>
  </div>
  <button id="stopBtn">🛑 Hentikan Total</button>

  <script src="popup.js"></script>
</body>
</html>
